name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint, Format & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rokit & Toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.rokit/bin"
          curl -sSL "https://github.com/rojo-rbx/rokit/releases/download/v1.2.0/rokit-1.2.0-linux-x86_64.zip" -o /tmp/rokit.zip
          unzip -q -o /tmp/rokit.zip -d "$HOME/.rokit/bin"
          chmod +x "$HOME/.rokit/bin/rokit"
          echo "$HOME/.rokit/bin" >> $GITHUB_PATH
          "$HOME/.rokit/bin/rokit" self-install
          if [ -n "$GITHUB_TOKEN" ]; then
            "$HOME/.rokit/bin/rokit" authenticate github --token "$GITHUB_TOKEN" --skip-verify
          fi
          "$HOME/.rokit/bin/rokit" install --no-trust-check

      - name: Static Analysis (Selene)
        run: selene src

      - name: Run Unit Tests (Lune)
        run: lune run tests/runner.luau

      - name: Check Formatting (StyLua)
        run: stylua --check tests
